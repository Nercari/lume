<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>composer</title>
</head>
<body>
  <div data-lume-composer>
    <textarea></textarea>
    <input type="file" multiple>
    <button type="button" data-lume-send id="send">Enviar</button>
  </div>
  <script>
    document.getElementById('send').addEventListener('click', () => {
      document.documentElement.dataset.sent = '1';
    });
  </script>
</body>
</html>
