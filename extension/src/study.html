<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Lume — estudo</title>
  <style>
    body { font: 14px/1.45 system-ui, sans-serif; margin: 24px; color: #1b1b1b; background: #fff; max-width: 42rem; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    button, a.button { margin: 8px 8px 0 0; }
    #misses { color: #a40000; }
    #parts { padding-left: 18px; }
    .note { color: #444; }
    @media (prefers-color-scheme: dark) {
      body { color: #eee; background: #1e1e1e; }
      .note { color: #aaa; }
      #misses { color: #ff8a80; }
    }
  </style>
</head>
<body>
  <h1>Estudo do processo</h1>
  <p class="note">A leitura acontece neste computador. O caso abre numa aba do PJe para o painel do ChatGPT. Salvar partes e Copiar parte k ficam aqui.</p>
  <p id="progress" role="status" aria-live="polite">Aguardando os documentos…</p>
  <p id="ocr" role="status" aria-live="polite"></p>
  <p id="result" role="status"></p>
  <ul id="misses"></ul>
  <p>
    <button id="cancel" type="button">Cancelar</button>
    <button id="save" type="button" hidden>Salvar partes</button>
  </p>
  <ul id="parts"></ul>
  <pre id="preview"></pre>
  <pre id="measure" hidden></pre>
  <pre id="sidecar" hidden></pre>
  <script type="module" src="study.js"></script>
</body>
</html>
