<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Lume</title>
  <style>
    body { font: 13px/1.4 system-ui, sans-serif; margin: 12px; color: #1b1b1b; background: #fff; }
    h1 { font-size: 15px; margin: 0 0 4px; }
    #status[data-kind="stop"] { color: #a40000; font-weight: 600; }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; }
    dt { color: #555; } dd { margin: 0; font-variant-numeric: tabular-nums; }
    table { border-collapse: collapse; width: 100%; margin-top: 8px; }
    th, td { text-align: left; padding: 2px 4px; border-bottom: 1px solid #ddd; }
    button { margin-right: 6px; }
    @media (prefers-color-scheme: dark) { body { color: #eee; background: #1e1e1e; } dt { color: #aaa; } th, td { border-color: #444; } #status[data-kind="stop"] { color: #ff8a80; } }
  </style>
</head>
<body>
  <h1>Lume</h1>
  <p>Processo: <strong id="case">—</strong></p>
  <p id="status" role="status" aria-live="polite"></p>
  <p id="pdf-hint" hidden>Baixe o processo completo no PJe (Download dos autos) e abra o PDF aqui.</p>
  <button id="pdf-mode" type="button">Abrir modo PDF</button>
  <dl id="counts"></dl>
  <button id="start" type="button">Ler processo</button><button id="stop" type="button">Parar</button>
  <table>
    <thead><tr><th>ID</th><th>Versão</th><th>Tipo</th><th>Págs.</th><th>Estado</th><th>Detalhe</th></tr></thead>
    <tbody id="items"></tbody>
  </table>
  <script type="module" src="panel.js"></script>
</body>
</html>
