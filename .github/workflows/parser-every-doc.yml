name: parser-every-doc

on:
  pull_request:
    paths:
      - 'manual/**'
      - '.github/workflows/parser-every-doc.yml'
  push:
    branches: [main]
    paths:
      - 'manual/**'
      - '.github/workflows/parser-every-doc.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
