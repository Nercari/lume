name: ci-aggregate

on:
  pull_request:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.packages.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: List mergeable packages
        id: packages
        run: |
          packages="$(./scripts/ci-list-packages.sh | jq -c .)"
          echo "packages=$packages"
          printf 'matrix=%s\n' "$(jq -nc --argjson p "$packages" '{package:$p}')" >> "$GITHUB_OUTPUT"

  smoke:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install, build, and test (${{ matrix.package }})
        run: ./scripts/ci-test-package.sh "${{ matrix.package }}"
