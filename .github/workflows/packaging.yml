name: packaging

on:
  pull_request:
    paths:
      - 'packaging/**'
      - '.github/workflows/packaging.yml'
  push:
    branches: [main]
    paths:
      - 'packaging/**'
      - '.github/workflows/packaging.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packaging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run build
      - run: npm test
