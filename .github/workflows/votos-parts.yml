name: votos-parts

on:
  pull_request:
    paths:
      - 'manual/src/pack.js'
      - 'manual/src/parts.js'
      - 'manual/src/index.js'
      - 'manual/test/pack*.test.js'
      - 'manual/test/parts*.test.js'
      - 'chatgpt/**'
      - '.github/workflows/votos-parts.yml'
  push:
    branches: [main]
    paths:
      - 'manual/src/pack.js'
      - 'manual/src/parts.js'
      - 'manual/src/index.js'
      - 'manual/test/pack*.test.js'
      - 'manual/test/parts*.test.js'
      - 'chatgpt/**'
      - '.github/workflows/votos-parts.yml'

permissions:
  contents: read

jobs:
  manual-parts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: node --test --test-reporter=spec test/pack.test.js test/parts.test.js

  chatgpt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chatgpt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
