name: manual

on:
  pull_request:
    paths:
      - 'manual/**'
      - 'chat-editor/src/method.js'
      - 'intake/src/rubric.mjs'
      - 'intake/schema/rubric.schema.json'
      - '.github/workflows/manual.yml'
  push:
    branches: [main]
    paths:
      - 'manual/**'
      - '.github/workflows/manual.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      # Real-case PDFs stay off CI. scripts/eval-private.mjs is for the maintainer's machine.
      # Chromium runs the synthetic image-page OCR check. The test uses /usr/bin/chromium when present.
      # No --with-deps: apt-get on this runner times out on azure.archive.ubuntu.com, and the image already has the Chromium libraries.
      - run: npx playwright install chromium
      - run: npm run build
      - run: npm test
