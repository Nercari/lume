name: plugins

on:
  pull_request:
    paths:
      - 'plugins/**'
      - '.github/workflows/plugins.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build logo and zip
        run: node plugins/scripts/build-zip.mjs
      - name: Test
        run: node --test plugins/test/
