name: source-panel

on:
  pull_request:
    paths:
      - 'source-panel/**'
      - 'chat-editor/src/**'
      - 'analysis/src/**'
      - 'analysis/test/fixtures.js'
      - 'extraction/src/**'
      - 'extraction/test/fixtures.js'
      - 'extraction/package.json'
      - 'extraction/package-lock.json'
      - 'case-store/src/**'
      - 'intake/src/**'
      - '.github/workflows/source-panel.yml'
  push:
    branches: [main]
    paths:
      - 'source-panel/**'
      - '.github/workflows/source-panel.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # source-panel imports chat-editor (#8), analysis (#6) and extraction (#2); extraction loads pdfjs-dist at import time.
      - run: npm ci --omit=optional
        working-directory: extraction
      - run: npm run build
        working-directory: source-panel
      - run: npm test
        working-directory: source-panel
