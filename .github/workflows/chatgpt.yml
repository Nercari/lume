name: chatgpt

on:
  pull_request:
    paths:
      - 'chatgpt/**'
      - '.github/workflows/chatgpt.yml'
  push:
    branches: [main]
    paths:
      - 'chatgpt/**'
      - '.github/workflows/chatgpt.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chatgpt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
