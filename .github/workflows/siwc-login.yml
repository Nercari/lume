name: siwc-login

on:
  pull_request:
    paths:
      - 'extension/**'
      - '.github/workflows/siwc-login.yml'
  push:
    branches: [main]
    paths:
      - 'extension/**'
      - '.github/workflows/siwc-login.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - run: node --test --test-reporter=spec test/siwc-auth.test.js test/siwc-session.test.js test/siwc-no-paid-fallback.test.js test/e2e-siwc.test.js
