name: extraction

on:
  pull_request:
    paths:
      - 'extraction/**'
      - 'extension/src/core.js'
      - 'extension/test/fixtures.js'
      - 'extension/test/dom.js'
      - 'case-store/src/**'
      - '.github/workflows/extraction.yml'
  push:
    branches: [main]
    paths:
      - 'extraction/**'
      - '.github/workflows/extraction.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extraction
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --omit=optional
      - run: npm run build
      - run: npm test
