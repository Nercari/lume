name: intake

on:
  pull_request:
    paths:
      - 'intake/**'
      - '.github/workflows/intake.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build (syntax check; plain ESM, no compile step)
        run: npm run build
      - name: Test
        run: npm test
      - name: Lint public files for identifying content
        run: npm run lint:public
