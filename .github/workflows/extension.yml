name: extension

on:
  pull_request:
    paths:
      - 'extension/**'
      - '.github/workflows/extension.yml'
  push:
    branches: [main]
    paths:
      - 'extension/**'
      - '.github/workflows/extension.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - run: npm test
