name: extension

on:
  pull_request:
    paths:
      - 'extension/**'
      - '.github/workflows/extension.yml'
  push:
    branches: [main]
    paths:
      - 'extension/**'
      - '.github/workflows/extension.yml'

permissions:
  contents: read

jobs:
  test:
    # Playwright has no chromium build for ubuntu26.04 (what ubuntu-latest now is); pin 24.04.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run build
      # No --with-deps: apt-get on this runner times out on azure.archive.ubuntu.com, and the image already has the Chromium libraries.
      - run: npx playwright-core install chromium
      - run: npm test
