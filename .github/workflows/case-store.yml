name: case-store

on:
  pull_request:
    paths:
      - 'case-store/**'
      - '.github/workflows/case-store.yml'
  push:
    branches: [main]
    paths:
      - 'case-store/**'
      - '.github/workflows/case-store.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: case-store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run build
      - run: npm test
