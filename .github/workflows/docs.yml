name: docs

on:
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  link-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify paths referenced from docs
        run: |
          set -euo pipefail
          test -f README.md
          test -f docs/packages.md
          for p in \
            intake chatgpt extension case-store extraction analysis chat-editor source-panel \
            intake/docs/data-flow-matrix.md intake/docs/official-sources.md intake/docs/rubric.md \
            chatgpt/LUME-ADENDO.md chatgpt/LEIA-ME.md extension/README.md \
            case-store/docs/design.md extraction/docs/design.md \
            analysis/docs/design.md chat-editor/docs/design.md source-panel/docs/design.md
          do
            test -e "$p" || { echo "missing: $p"; exit 1; }
          done
          echo "link-sanity ok"

  repo-smoke:
    # Playwright has no chromium build for ubuntu26.04 (what ubuntu-latest now is); pin 24.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # ci-test-package.sh installs each package (and extraction's pdfjs-dist for the dependent ones), builds, and tests.
      - name: Package tests
        run: |
          set -euo pipefail
          for pkg in intake chatgpt extension case-store extraction analysis chat-editor source-panel; do
            echo "== $pkg =="
            ./scripts/ci-test-package.sh "$pkg"
          done
      - name: intake public linter
        working-directory: intake
        run: npm run lint:public
